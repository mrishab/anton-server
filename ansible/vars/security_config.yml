---
# Security Configuration
## SSH Configuration
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_allow_groups: "admin sudo"
ssh_challenge_response_authentication: "no"
ssh_pubkey_authentication: "yes"

# UFW Firewall Rules - Restricted to SSH and Monitoring
ufw_default_incoming: "deny"
ufw_default_outgoing: "allow"

ufw_rules:
  - { rule: "allow", port: "22", comment: "SSH" }
  - { rule: "allow", port: "9100", comment: "Node Exporter" }
  - {
      rule: "allow",
      port: "1514",
      proto: "tcp",
      comment: "Wazuh agent-manager communication",
    }
  - {
      rule: "allow",
      port: "1515",
      proto: "tcp",
      comment: "Wazuh agent enrollment",
    }
  - {
      rule: "allow",
      port: "8445",
      proto: "tcp",
      comment: "Wazuh Dashboard Web UI",
    }

# Wazuh Configuration
wazuh_manager_host: "127.0.0.1"
wazuh_manager_deploy: true
wazuh_dashboard_port: 8445
wazuh_dashboard_bind: "0.0.0.0"

# Additional Security Packages
security_packages:
  - ufw
  - unattended-upgrades

# Unattended upgrades email notifications
security_admin_email: "rishab.manocha@outlook.com"
