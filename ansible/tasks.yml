# Core tasks for Anton Server
- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Remove all Docker apt source entries (including unsigned/conflicting ones)
  shell: |
    # Remove any .list files that reference the Docker download URL
    grep -rl 'download.docker.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r rm -f
    # Strip any inline Docker lines from /etc/apt/sources.list
    sed -i '/download\.docker\.com/d' /etc/apt/sources.list
  changed_when: false

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ docker_repo_arch | default('amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install packages
  apt:
    name: "{{ system_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Create symlink for batcat to bat
  file:
    src: /usr/bin/batcat
    dest: /usr/bin/bat
    state: link
    force: yes
  ignore_errors: yes

- name: Configure Docker daemon to listen on TCP 172.17.0.1:2375
  block:
    - name: Create Docker systemd override directory
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: "0755"

    - name: Configure Docker to expose TCP API
      copy:
        dest: /etc/systemd/system/docker.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/dockerd \
            -H unix:///var/run/docker.sock \
            -H tcp://0.0.0.0:2375 \
            --containerd=/run/containerd/containerd.sock
      notify:
        - reload systemd
        - restart docker

- name: Ensure Docker is started
  service:
    name: docker
    state: started
    enabled: yes

- name: Load host-specific secrets
  include_vars:
    file: "vars/secrets/{{ inventory_hostname }}.yml"
  failed_when: false

- name: Ensure user groups exist
  group:
    name: "{{ item }}"
    state: present
  loop: "{{ users | map(attribute='groups', default=[]) | flatten | unique }}"

- name: Manage users
  user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default([]) }}"
    password: "{{ (user_passwords | default({}))[item.name] | default(omit) }}"
    append: yes
    shell: /bin/bash
    create_home: yes
    non_unique: yes
  loop: "{{ users }}"

- name: Set up authorized keys for users
  authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.public_key }}"
  when: item.public_key is defined
  loop: "{{ users }}"

- name: Ensure storage mount points exist
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(primary_user) }}"
    group: "{{ item.group | default(primary_user) }}"
    mode: "0755"
  loop: "{{ filesystems }}"
  when: item.path not in ["/", "none"]

- name: Create backup directories
  file:
    path: "{{ item.0.path }}{{ item.1 }}"
    state: directory
    owner: "{{ item.0.backup_owner | default(item.0.owner) | default(primary_user) }}"
    group: "{{ item.0.backup_group | default(item.0.group) | default(primary_user) }}"
    mode: "0755"
  with_subelements:
    - "{{ filesystems }}"
    - backups
    - skip_missing: true

- name: Configure mdadm monitoring and homehost
  lineinfile:
    path: /etc/mdadm/mdadm.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: yes
  loop:
    - {
        regexp: "^MAILADDR",
        line: "MAILADDR {{ storage_settings.monitoring.email }}",
      }
    - {
        regexp: "^HOMEHOST",
        line: "HOMEHOST {{ storage_settings.monitoring.homehost }}",
      }

- name: Configure storage mounts in fstab
  mount:
    path: "{{ item.path }}"
    src: "{{ item.source }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.options | default('defaults') }}"
    state: present
  loop: "{{ filesystems }}"
  when:
    - item.source is defined
    - item.path != "/"
    - item.fstype != "swap"

- name: Apply sysctl settings
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ sysctl_settings | dict2items }}"

- name: Configure SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - {
        regexp: "^#?PermitRootLogin",
        line: "PermitRootLogin {{ ssh_permit_root_login }}",
      }
    - {
        regexp: "^#?PasswordAuthentication",
        line: "PasswordAuthentication {{ ssh_password_authentication }}",
      }
    - {
        regexp: "^#?PubkeyAuthentication",
        line: "PubkeyAuthentication {{ ssh_pubkey_authentication }}",
      }
    - {
        regexp: "^#?ChallengeResponseAuthentication",
        line: "ChallengeResponseAuthentication {{ ssh_challenge_response_authentication }}",
      }
    - { regexp: "^#?AllowGroups", line: "AllowGroups {{ ssh_allow_groups }}" }
  notify: restart ssh

- name: Configure UFW rules
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('any') }}"
  loop: "{{ ufw_rules }}"

- name: Enable UFW Firewall
  ufw:
    state: enabled

- name: Purge legacy security packages
  apt:
    name:
      - fail2ban
      - auditd
      - aide
    state: absent
    purge: yes


- name: Ensure AppArmor is started and enabled
  service:
    name: apparmor
    state: started
    enabled: yes

- name: Enable Ubuntu Pro (Expanded Security Maintenance)
  command: pro attach {{ ubuntu_pro_token }}
  args:
    creates: /var/lib/ubuntu-advantage/private/machine-token.json
  when: ubuntu_pro_token is defined

- name: Configure unattended-upgrades for automatic security updates
  copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}_ESM_Apps:${distro_codename}-apps-security";
          "${distro_id}_ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Package-Blacklist {
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::InstallOnShutdown "false";
      Unattended-Upgrade::Mail "{{ security_admin_email }}";
      Unattended-Upgrade::MailOnlyOnError "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
    owner: root
    group: root
    mode: "0644"

- name: Enable periodic apt downloads and upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Install sysstat package
  apt:
    name: sysstat
    state: present

- name: Ensure sysstat collector is enabled
  lineinfile:
    path: /etc/default/sysstat
    regexp: "^ENABLED="
    line: 'ENABLED="true"'
    create: yes
  notify: restart sysstat

- name: Ensure sysstat is started and enabled
  service:
    name: sysstat
    state: started
    enabled: yes

- name: Install rkhunter package
  apt:
    name: rkhunter
    state: present

- name: Configure daily rkhunter scan
  lineinfile:
    path: /etc/default/rkhunter
    regexp: "^CRON_DAILY_RUN="
    line: 'CRON_DAILY_RUN="true"'
    create: yes

- name: Configure weekly rkhunter database updates
  lineinfile:
    path: /etc/default/rkhunter
    regexp: "^CRON_DB_UPDATE="
    line: 'CRON_DB_UPDATE="true"'
    create: yes

- name: Configure rkhunter alert email
  lineinfile:
    path: /etc/rkhunter.conf
    regexp: "^#?MAIL-ON-WARNING="
    line: 'MAIL-ON-WARNING="{{ security_admin_email }}"'
    create: yes

- name: Configure daily Lynis security audit cron job
  cron:
    name: "Daily Lynis Security Audit"
    special_time: daily
    job: "/usr/sbin/lynis audit system --cronjob 2>&1 | logger -t lynis-audit"

- name: Configure monthly Lynis security audit cron job
  cron:
    name: "Monthly Lynis Security Audit"
    special_time: monthly
    job: "/usr/sbin/lynis audit system --cronjob 2>&1 | logger -t lynis-monthly"

- name: Setup Node Exporter
  block:
    - name: Create node_exporter group
      group:
        name: "{{ node_exporter_group }}"
        state: present
        system: yes

    - name: Create node_exporter user
      user:
        name: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        shell: /bin/false
        system: yes
        create_home: no
        state: present

    - name: Check if node_exporter binary exists
      stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_bin

    - name: Download and install node_exporter
      unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: /tmp
        remote_src: yes
      when: not node_exporter_bin.stat.exists
      check_mode: no

    - name: Copy binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        remote_src: yes
      when: not node_exporter_bin.stat.exists

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Start Node Exporter
      service:
        name: node_exporter
        state: started
        enabled: yes
